{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Welcome, {{ user.full_name }}!</h1>
        <p class="current-time" id="live-clock"></p>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <h3 class="stat-title">Total Logins</h3>
        <p class="stat-value">{{ total_logins }}</p>
    </div>
    <div class="stat-card">
        <h3 class="stat-title">Account Status</h3>
        <p class="stat-value" style="color: {{ 'var(--success-color)' if user.is_verified else 'var(--error-color)' }}">{{ account_status }}</p>
    </div>
    <div class="stat-card">
        <h3 class="stat-title">Profile Completion</h3>
        <p class="stat-value">{{ profile_completion }}%</p>
    </div>
</div>

<div class="card">
    <h3 style="margin-bottom: 16px;">Recent Activity</h3>
    <p style="color: var(--text-muted)">Your recent activity will appear here.</p>
</div>
{% endblock %}
